# Codecov configuration for ev-flow.
# Coverage is informational, not a hard merge gate: the package ships a
# documented set of EXPLAINED_FAIL methodology limitations, and we don't want a
# coverage delta blocking otherwise-sound PRs. Tune thresholds up over time.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

# The package under test is src/pev_synth; tests themselves are not measured.
ignore:
  - "tests/**"
  - "docs/**"

comment:
  layout: "reach, diff, files"
  require_changes: true
