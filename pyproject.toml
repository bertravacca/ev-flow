[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ev-flow"
version = "3.0.2"
description = "Synthetic plug-in electric vehicle charging dataset pipeline and library API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Bertrand Travacca", email = "bertrand.travacca@gmail.com" },
]
keywords = [
    "electric-vehicles",
    "ev",
    "charging",
    "synthetic-data",
    "energy",
    "grid",
    "nhts",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "requests>=2.32",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pytz>=2024.1",
]

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    # numpy 2.5 ships PEP 695 `type` statements in its stubs, which mypy rejects
    # under our py3.10 type target ("Type statement is only supported in Python
    # 3.12 and greater"). Cap numpy for the dev/type-check env only; runtime
    # `dependencies` above stay unconstrained for end users.
    "numpy<2.5",
    "build>=1.2",
    "twine>=5",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "matplotlib>=3.7",
]

[project.scripts]
ev-flow = "pev_synth.cli:main"

[project.urls]
Homepage = "https://github.com/bertravacca/ev-flow"
Repository = "https://github.com/bertravacca/ev-flow"
Issues = "https://github.com/bertravacca/ev-flow/issues"

# --- Hatch build configuration ---------------------------------------------
# Only the src/pev_synth/ tree is packaged. Everything else at the repo root
# (README, LICENSE, tests/, CI config, etc.) lives in the repo but is
# excluded from the published wheel/sdist by packaging only src/pev_synth.

[tool.hatch.build.targets.wheel]
packages = ["src/pev_synth"]

# ``only-include`` is an allowlist: the sdist ships exactly these paths (plus
# the auto-generated PKG-INFO). ``include`` alone is not exclusive under
# hatchling and was leaking docs/ and .gitignore into the sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/pev_synth",
    "README.md",
    "LICENSE",
    "ATTRIBUTION.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

# --- Tooling ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# --- mypy static type-checking ---------------------------------------------
# The package ships a `py.typed` marker, so downstream users get our types.
# CI runs `mypy` (reading this config) as a required gate. The policy is:
# the public / lightweight surface is strict-clean; the heavy internal
# pipeline modules are relaxed for now (gradual typing — tracked for a later
# pass, see the per-module overrides below).
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/pev_synth"]
# Several runtime deps (pandas, scipy, scikit-learn, pytz, matplotlib) do not
# ship a `py.typed` marker, so mypy cannot find inline types for them. Rather
# than vendor third-party stub packages (pandas-stubs et al. are strict and
# would drown the heavy modules in churn), we treat these libraries as
# untyped at the import boundary. Our own code stays strictly checked.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "pytz.*",
    "matplotlib.*",
    # Optional downstream consumer used only inside a guarded, lazy import in
    # api.py (pev-optim is not a dependency of ev-flow).
    "pev_optim.*",
]
ignore_missing_imports = true

# Heavy internal pipeline modules (M1..M9 implementation) are not strict-clean
# yet. They are excluded from strict enforcement as a deliberate gradual-typing
# step for the v4 launch and tracked for a follow-up pass (F27). Everything NOT
# listed below stays strict and must remain clean — that is the whole public
# API surface plus the lighter helpers and loaders (api, regions, __init__,
# _paths, cli, plotting, _seeds, _meta, _phev_fuel_economy, _utc_migration,
# sales_mix_data, acs_loader, nhts_loader, nhts_nextgen_loader, soc_trajectory,
# validation_bounds_curator).
#
# NOTE: cache_regen and hourly_resampler are relaxed here as well; they are
# being actively refactored in parallel and are not safe to retype right now.
[[tool.mypy.overrides]]
module = [
    "pev_synth.donor_matcher",
    "pev_synth.travel_week_builder",
    "pev_synth.vehicle_archetypes",
    "pev_synth.plug_in_model",
    "pev_synth.validator",
    "pev_synth.cache_regen",
    "pev_synth.hourly_resampler",
]
ignore_errors = true
