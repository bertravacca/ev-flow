name: Bug report
description: Report a problem with ev-flow
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in the details
        below. For **security** issues, do not use this form — see
        [SECURITY.md](https://github.com/bertravacca/ev-flow/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: ev-flow version
      description: 'Output of `python -c "import pev_synth; print(pev_synth.__version__)"`'
      placeholder: "3.0.2"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that reproduces the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region / profile_type (if relevant)
      placeholder: "bay_area / residential"
    validations:
      required: false
  - type: textarea
    id: traceback
    attributes:
      label: Traceback / logs
      render: shell
    validations:
      required: false
