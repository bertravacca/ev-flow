name: Draft JOSS paper PDF

# Compiles paper.md into the JOSS-styled paper.pdf using the Open Journals
# Pandoc pipeline, so the proof PDF can be checked before/at submission.
# Runs manually (Actions tab -> Run workflow) and whenever the paper changes.

on:
  workflow_dispatch:
  push:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/draft-pdf.yml

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md

      - name: Upload paper.pdf
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf
