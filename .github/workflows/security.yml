name: security

# Dependency + static security scanning (F31). Runs on every push/PR and on a
# weekly schedule so newly-disclosed dependency vulnerabilities surface even
# when the code hasn't changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: bandit (static security lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit
      # Gate on medium+ severity. The ~32 low-severity findings are benign and
      # intentional: internal-invariant asserts (B101), validation-result dict
      # keys named "pass" mis-flagged as passwords (B105), and one controlled
      # `git rev-parse HEAD` subprocess for build provenance (B404/B603/B607/
      # B110). Gating on medium+ keeps the source free of #nosec noise while
      # still failing on anything genuinely risky introduced later.
      - run: bandit -r src/pev_synth --severity-level medium

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Install only the runtime closure (no dev extras) so the audit reflects
      # exactly what `pip install ev-flow` exposes to users.
      - run: pip install .
      - run: pip install pip-audit
      - run: pip-audit
