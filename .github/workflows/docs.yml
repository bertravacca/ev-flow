name: docs

on:
  push:
    branches: [main]
  pull_request:

# Allow one concurrent deployment; queue (not cancel) so an in-flight
# Pages deploy is never aborted mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Always build the site. On pull_request this is a strict gate; on push to
  # main it produces the artifact that the deploy job publishes.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # mkdocstrings imports pev_synth to read its docstrings, so the package
      # must be installed alongside the docs toolchain.
      - name: Install package + docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict
      # On a push to main, hand the built site to the deploy job.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Deploy only on push to main. Pull-request runs stop after the strict build.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
