name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Generate the self-contained literature sales-mix CSVs the validator
      # tests depend on (no network; built from in-code priors). data/ is
      # gitignored, so this must run on a fresh checkout before pytest.
      # `python -m` behaves identically on POSIX and Windows shells.
      - run: python -m pev_synth.sales_mix_data build-sales-mix
      - run: pytest --cov=pev_synth --cov-report=xml --cov-report=term-missing
      # Upload coverage once, from a single representative cell, so the 12-cell
      # matrix produces one clean report instead of 12 racing uploads.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # mypy reads its config (target, strict, files, per-module overrides)
      # from [tool.mypy] in pyproject.toml: strict on the public API surface,
      # relaxed on the heavy internal pipeline modules (F27, gradual typing).
      - run: mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
