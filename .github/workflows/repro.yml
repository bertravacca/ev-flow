name: reproducibility

# Determinism regression check (F28): regenerate a cache twice with the same
# seed and assert the data artifacts are byte-for-content identical. This is
# heavy — it downloads the NHTS 2017 microdata and runs the M2–M7 pipeline
# twice — so it runs weekly and on demand rather than on every PR.
on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  workflow_dispatch:
    inputs:
      n:
        description: "Fleet size N for each of the two builds"
        default: "150"

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Editable install so repo_root() (and thus the one-time NHTS download
      # location) anchors at the checkout. The SPEECh K=16 params ship as
      # package data, so a clean runner has everything it needs after the NHTS
      # fetch that bootstrap performs.
      - run: pip install -e .
      # Regenerates bay_area/residential twice into separate data roots and
      # compares the six data parquets by content hash. Fails the job if any
      # artifact differs across the two same-seed builds.
      - run: python scripts/repro_check.py --region bay_area --profile-type residential --n ${{ github.event.inputs.n || '150' }}
